name: Project checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      requirements_file:
        type: string
        default: requirements-dev.lock
concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r ${{ inputs.requirements_file || 'requirements-dev.lock' }}
      - run: python -m compileall -q .
      - run: python -m ruff check . --select F821,F822,F823,F811
      - run: python tools/format_templates.py --check
      - run: python -m unittest discover -s tests -v
      - name: Compare receipt visual references
        if: matrix.python == '3.12'
        run: python tools/check_receipt_visuals.py
      - run: python -m bandit -r . --exclude ./tests -lll
  browser:
    timeout-minutes: 10
    # Match the pinned Playwright browser/dependency support window.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install -r ${{ inputs.requirements_file || 'requirements-dev.lock' }}
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - name: Check browser flows and responsive layouts
        run: node tools/browser_smoke.cjs

  mac-installation:
    timeout-minutes: 10
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r ${{ inputs.requirements_file || 'requirements-dev.lock' }}
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -p test_runtime_reliability.py -v
      - run: python -m unittest discover -s tests -p test_daily_usability.py -v
      - name: Verify release pins and offline installation checks
        if: inputs.requirements_file != 'requirements-dev.txt'
        run: python tools/pi_acceptance.py --offline
