<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt Control</title><style>body{font-family:system-ui;background:#eee;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;padding:28px;border-radius:16px;width:min(360px,calc(100vw - 60px));box-shadow:0 8px 30px #0002}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;font:inherit}.flash{background:#f5dddd;padding:10px}</style></head><body><main class="card"><h1>Receipt Control</h1><p>Sign in to manage the printer.</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="password" name="password" autocomplete="current-password" required autofocus placeholder="Password"><button>Sign in</button></form></main></body></html>
